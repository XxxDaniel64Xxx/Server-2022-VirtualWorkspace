name: Windows Server Gaming Workspace

on:
  workflow_dispatch:

jobs:
  setup-workspace:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🚀 Optimize Windows for Gaming & UI
        shell: pwsh
        run: |
          Write-Host "Disabling Server Manager popup on login..."
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Server\ServerManager" -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Server\ServerManager" -Name "DoNotOpenServerManagerAtLogon" -Value 1 -ErrorAction SilentlyContinue

      - name: 🌐 Install and Configure Tailscale
        shell: cmd
        run: |
          echo Downloading Tailscale...
          powershell -Command "Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' -OutFile '%USERPROFILE%\tailscale-setup.exe'"
          
          echo Installing Tailscale silently...
          "%USERPROFILE%\tailscale-setup.exe" /quiet
          
          echo Waiting for Tailscale to initialize...
          powershell -Command "Start-Sleep -Seconds 20"
          
          if exist "%ProgramFiles%\Tailscale\tailscale.exe" (
              set "TAILSCALE_PATH=%ProgramFiles%\Tailscale\tailscale.exe"
          ) else if exist "%ProgramFiles(x86)%\Tailscale\tailscale.exe" (
              set "TAILSCALE_PATH=%ProgramFiles(x86)%\Tailscale\tailscale.exe"
          ) else (
              echo Tailscale installation failed!
              exit /b 1
          )
          
          echo Starting Tailscale...
          "%TAILSCALE_PATH%" up --hostname=win-gaming-latest
          echo Tailscale is running.

      - name: 🎮 Install ViGEmBus (Virtual Controller)
        shell: pwsh
        run: |
          Write-Host "Downloading ViGEmBus v1.21.442..."
          Invoke-WebRequest -Uri "https://github.com/nefarius/ViGEmBus/releases/download/v1.21.442.0/ViGEmBus_1.21.442_x64_x86_arm64.exe" -OutFile "ViGEmBus.exe"
          
          Write-Host "Installing Virtual Gamepad Emulation Bus Driver silently..."
          Start-Process -FilePath ".\ViGEmBus.exe" -ArgumentList "/quiet", "/norestart" -Wait -NoNewWindow
          
          Write-Host "ViGEmBus Installed Successfully!"

      - name: ☀️ Install and Configure Sunshine Game Streaming
        shell: pwsh
        run: |
          Write-Host "Fetching the exact URL for the latest Sunshine release..."
          $apiResponse = Invoke-RestMethod -Uri "https://api.github.com/repos/LizardByte/Sunshine/releases/latest"
          $downloadUrl = ($apiResponse.assets | Where-Object { $_.name -like "*windows*.exe" }).browser_download_url | Select-Object -First 1
          
          if (-not $downloadUrl) {
              Write-Host "Error: Could not find the Windows installer in the latest release!"
              exit 1
          }
          
          Write-Host "Downloading Sunshine from: $downloadUrl"
          Invoke-WebRequest -Uri $downloadUrl -OutFile "sunshine.exe"
          
          Write-Host "Installing Sunshine silently..."
          Start-Process -FilePath ".\sunshine.exe" -ArgumentList "/S" -Wait -NoNewWindow
          
          Write-Host "Configuring Windows Firewall for all profiles..."
          netsh advfirewall firewall add rule name="Sunshine Web UI" dir=in action=allow protocol=TCP localport=47990 profile=any
          netsh advfirewall firewall add rule name="Sunshine Stream TCP" dir=in action=allow protocol=TCP localport=47984,47989,48010 profile=any
          netsh advfirewall firewall add rule name="Sunshine Stream UDP" dir=in action=allow protocol=UDP localport=47998,47999,48000,48002,48010 profile=any

          Write-Host "Configuring Sunshine config to bypass CSRF and allow Tailscale..."
          $configDir = "$env:ProgramData\Sunshine\config"
          if (-not (Test-Path $configDir)) {
              New-Item -ItemType Directory -Path $configDir -Force | Out-Null
          }
          $configFile = "$configDir\sunshine.conf"
          
          # Fixes CSRF error using the updated configuration directive
          $configContent = @(
              "origin_web_ui_allowed = *"
              "address_family = dual"
          )
          $configContent | Out-File -FilePath $configFile -Encoding ascii -Force

          Write-Host "Launching Sunshine service/process..."
          $sunshinePath = "C:\Program Files\Sunshine\sunshine.exe"
          if (-not (Test-Path $sunshinePath)) {
              $sunshinePath = "${env:ProgramFiles(x86)}\Sunshine\sunshine.exe"
          }
          
          if (Test-Path $sunshinePath) {
              Start-Process -FilePath $sunshinePath -WindowStyle Hidden
              Write-Host "Sunshine launched successfully!"
          } else {
              Write-Host "Warning: Sunshine path not found automatically."
          }

      - name: 💬 Display Gaming Workspace Info
        shell: cmd
        run: |
          echo ===============================================
          echo Windows Latest GAMING Workspace Ready
          echo -----------------------------------------------
          echo Tailscale hostname: win-gaming-latest
          echo Sunshine Web UI: http://[YOUR-TAILSCALE-IP]:47990
          echo -----------------------------------------------
          echo MADE BY DANIEL 64. DM IN TELEGRAM @daniel64idk 
          echo ===============================================

      - name: ⏳ Keep-Alive Loop
        shell: pwsh
        run: |
          $tz = [System.TimeZoneInfo]::FindSystemTimeZoneById('FLE Standard Time')
          $endTime = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId((Get-Date).AddHours(6), $tz.Id)
          Write-Host "Workspace active until (Minsk time): $endTime"
          Write-Host "Enjoy your cloud gaming!"
          while ($true) { Start-Sleep -Seconds 10 }
